name: Test

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled run would leave its end-to-end test stack behind
  cancel-in-progress: false

jobs:
  typescript-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit

      - run: npx tsc

  e2e-tests:
    runs-on: ubuntu-latest

    # Deploys to AWS, which pull requests from forks cannot do
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ vars.CI__AWS_REGION }}
      IMAGEMAGICK_LAYER_BUCKET: ${{ secrets.CI__IMAGEMAGICK_LAYER_BUCKET }}
      # Deploy a stack of its own, so it neither touches production, nor a
      # concurrent run of this workflow
      STACK_NAME: photos-cdn-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.CI__AWS_ACCOUNT_ID }}:role/coderbyheart-ci-photos-scaler
          aws-region: ${{ vars.CI__AWS_REGION }}

      - name: Deploy the test stack
        run: npx cdk deploy "$STACK_NAME" --require-approval never --outputs-file stack-outputs.json

      - name: Run the end-to-end tests
        run: npm run test:e2e

      # Name the stack, so an unset STACK_NAME cannot destroy production
      - name: Destroy the test stack
        if: always()
        run: npx cdk destroy -f "$STACK_NAME"
